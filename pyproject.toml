[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vtt-translator"
version = "2.0.0"
description = "Translate WebVTT subtitle files using LLMs (AWS Bedrock Claude)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "boto3>=1.28.0",
    "botocore>=1.31.0",
    "pydantic>=2.5.0",
    "webvtt-py>=0.5.0",
]

[project.scripts]
vttt = "vtt_translator.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["vtt_translator"]
